name: Preserve verified image archives
on:
  push:
    branches: [delivery/archive-releases]

permissions:
  actions: read
  contents: write

jobs:
  archive:
    strategy:
      matrix:
        include:
          - { tag: v1.0.1, run: 45606024470 }
          - { tag: v2.0.1, run: 45606024300 }
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ matrix.tag }}
      RUN_ID: ${{ matrix.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate a transfer delta for the verified release
        shell: bash
        run: |
          gh run download "$RUN_ID" -n "image-$TAG" -D archive
          (cd archive && sha256sum -c image.sha256)
          curl --fail --silent --show-error --location --max-time 90 \
            'https://github.com/SashaPom/submission-canary-lab/releases/download/v1.0.0-ci/image.tar.gz' -o base.tar.gz
          printf '%s  %s\n' '4ce7d0aca6a111a6c24a6fb9034545ee9f057e49f91443c681f52ab322ef40f1' base.tar.gz | sha256sum -c
          python3 transfer.py create base.tar.gz archive/image.tar.gz transfer
          ls -lh transfer
          gh release upload "$TAG" transfer/transfer.json transfer/transfer.bin.gz
